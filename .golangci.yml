version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - gocyclo
    - lll
    - misspell
  settings:
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
    gosec:
      excludes:
        - G204 # tools run user-approved commands by design
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - lll
    paths:
      # internal/legacytools is the untouched v2 tool package, moved aside in Phase 2 Task 6 so the
      # new internal/tools package could take its place; it is deleted whole in Task 12. new-from-rev
      # below cannot reliably pair the move as a rename when a new file lands at the old path (as
      # file_tools.go and registry.go do here), so it is excluded by path instead.
      - ^internal/legacytools/

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

issues:
  # Legacy debt is cleared file by file as Phase 1 and 2 rewrite them.
  new-from-rev: v2.0.4
