# Tara Code Configuration File (v3)
# Copy this to ~/.taracode/config.yaml
#
# Migrating from a 2.x config file: model: was a section (model.temperature, model.top_p,
# model.num_predict); model: <name> takes its place now, and those three keys move under
# generation:. security.default_severity is scan.default_severity now. The agents: and watch:
# sections are no longer read. mode: devops/security became investigate/operate (unset starts in
# investigate, or the mode a policy file names). A 2.x file still starts taracode; each of these
# prints a one-time migration warning after the startup banner.

# LLM server host (required unless hosts: below is used)
host: http://localhost:11434

# API key (optional, for hosts that require one)
key: ""

# =============================================================================
# MULTI-HOST CONFIGURATION
# =============================================================================
# Configure multiple LLM hosts with fallback support. When hosts: is set, host: above is ignored.
#
# hosts:
#   primary:
#     url: http://gpu-server:11434
#     vendor: ollama                       # optional: ollama, vllm, llama.cpp (auto-detect if omitted)
#     # api_key: ""                        # optional: API key if required
#     models: [glm-4.7-flash, qwen3.6:35b] # optional: models available on this host
#     timeout: 30s                         # connection timeout
#     priority: 1                          # lower = higher priority
#
#   local:
#     url: http://localhost:11434
#     fallback: primary                    # use primary when this host is unavailable
#     priority: 2
#
# default_host: primary
#
# Run /hosts in the REPL to see host status and health.

# Model name (optional; auto-detected from the server when unset)
# model: glm-4.7-flash

# Generation options for the main chat
generation:
  temperature: 0.7     # sampling randomness, 0.0-2.0 (default: 0.7)
  top_p: 0.9            # nucleus sampling threshold, 0.0-1.0 (default: 0.9)
  num_predict: 0         # max tokens per response, 0 = model default / no limit (default: 0)

# Context management
context:
  max_tool_output_lines: 500    # max lines per tool output, 0 = unlimited (default: 500)
  max_tool_output_chars: 15000  # max chars per tool output, 0 = unlimited (default: 15000)
  max_tool_iterations: 20       # max tool call iterations per message (default: 20)
  compaction_enabled: true      # auto-compact the conversation as the budget fills (default: true)
  compaction_threshold: 0.75    # compact at this fraction of max_context_tokens (default: 0.75)
  compaction_keep_recent: 4     # recent message pairs compaction never summarizes (default: 4)
  window: auto                  # "auto" (the model's native max, capped) or a token count (default: auto)

# Reasoning mode sent with every request: auto, off, on, low, medium, high (default: auto)
# Change it mid-session with /think without restarting taracode
think: auto

# How long Ollama keeps the model loaded, "" = server default, "-1" = keep loaded (default: "")
keep_alive: ""

# Starting operating mode: investigate or operate (default: unset, starts in investigate unless a
# policy file names one - see .taracode/policy.yaml)
mode: investigate

# Disable every internet-facing tool (web_search, web_fetch) and the startup update check
# (default: false)
offline: false

# Security scanning
scan:
  # Default severity filter for the scan tool (empty = all severities)
  # Examples: "HIGH,CRITICAL" or "MEDIUM,HIGH,CRITICAL"
  default_severity: ""

# Web search
search:
  primary: duckduckgo    # primary provider: brave, duckduckgo, or searxng (default: duckduckgo)
  fallback: searxng        # fallback provider when primary fails (default: searxng)
  timeout: 10s               # search timeout (default: 10s)
  retry_count: 1               # retries before falling back (default: 1)
  # brave_api_key: your-brave-api-key-here       # becomes the default primary when set
  # searxng_instance: https://your-searxng-instance.com

# Persistent project knowledge
memory:
  enabled: true              # remember and recall project facts (default: true)
  max_memories: 500           # maximum memories kept per project (default: 500)
  max_context_tokens: 2000     # max tokens of memories injected into the prompt (default: 2000)
  retention_days: 90            # auto-cleanup memories unused for N days (default: 90)
  auto_capture: true              # detect and suggest memories from the conversation (default: true)

# Auto-update
upgrade:
  auto_check: true      # check for updates on startup (default: true)
  auto_upgrade: false     # install updates without prompting (default: false)
  show_changelog: true      # show the changelog when an update is available (default: true)

# Model Context Protocol servers
mcp:
  enabled: true    # enable MCP support (default: true)
  servers:
    # GitHub MCP Server
    # - name: github
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-github"]
    #   env:
    #     GITHUB_TOKEN: "${GITHUB_TOKEN}"   # env var expansion
    #   auto_connect: false                 # true connects on startup
    #   timeout: 30s

    # Filesystem MCP Server
    # - name: filesystem
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/directory"]

# Show a diff preview before applying edit_file operations (default: true)
preview_edits: true

# Minimum lines changed to trigger a preview, 0 = always preview (default: 0)
preview_threshold: 0

# Show token usage in the prompt, like [5.0k/32k] (default: true)
show_context_budget: true

# The model's context window in tokens; also the compaction budget (default: 32768)
max_context_tokens: 32768

# Disable live streaming of shell command output to the terminal (default: false)
no_stream_commands: false
