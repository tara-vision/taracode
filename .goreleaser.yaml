version: 2

project_name: taracode

before:
  hooks:
    - go mod tidy

builds:
  - id: taracode
    main: .
    binary: taracode
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tara-vision/taracode/cmd.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    ids: [taracode]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The macOS binaries are signed with the Developer ID certificate and notarized, so Gatekeeper accepts the quarantined
# download a cask install makes. The release workflow stops before this when a secret is missing
# (scripts/require-signing.sh); a snapshot or `goreleaser check` without the secrets skips it.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [taracode]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

signs:
  # cosign 3.x writes a Sigstore bundle (signature + certificate + log entry in one file).
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

nfpms:
  - id: packages
    package_name: taracode
    ids: [taracode]
    vendor: Tara Vision, LLC
    homepage: https://github.com/tara-vision/taracode
    maintainer: "Tara Vision, LLC <contact@tara.vision>"
    description: DevOps and Cloud SI assistant for Kubernetes, Terraform, Docker and multi-cloud, running locally on taraengine
    license: MIT
    formats:
      - deb
      - rpm
    section: utils
    bindir: /usr/local/bin

homebrew_casks:
  - name: taracode
    repository:
      owner: tara-vision
      name: homebrew-taracode
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/tara-vision/taracode
    description: DevOps and Cloud SI assistant that runs locally on taraengine
    license: MIT
    binaries:
      - taracode
    caveats: |
      taracode runs on taraengine, with a tool-capable model. On an Apple Silicon Mac:

        brew install --cask tara-vision/taracode/taraengine
        taraengine pull gemma4:12b      # 16 GB of RAM
        taraengine pull glm-4.7-flash   # 32 GB of RAM
        taraengine pull gemma4:31b      # 48 GB of RAM and up

      On Linux: curl -fsSL https://engine.tara.vision/install.sh | bash
      On an Intel Mac, point taracode at another OpenAI-compatible server with --host.
      Then run `taracode` inside a project directory.
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Update taracode cask to {{ .Tag }}"
    skip_upload: auto

release:
  github:
    owner: tara-vision
    name: taracode
  draft: false
  prerelease: auto
  mode: replace

changelog:
  disable: true
