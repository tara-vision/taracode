id: pending-taint
area: kubernetes
mode: investigate
provenance: recorded
prompt: >
  The nightly-etl job pod in namespace batch will not schedule. Explain why.
expect:
  tools_called_any:
    - {tool: kubectl, verb: describe}
    - {tool: kubectl, verb: get, signature_matches: "event"}
    - {tool: shell, signature_matches: "^kubectl (describe|get event)"}
  tools_never:
    - {classification: mutate}
  answer_matches: ["(?i)taint", "(?i)tolerat"]
  max_iterations: 8
record:
  scenario: kubernetes/pending-taint
  calls:
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: batch}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: batch, output: wide}}
    - {tool: kubectl, args: {verb: describe, resource: pod, name: "{{pod app=nightly-etl ns=batch}}", namespace: batch}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: batch}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: batch, args: "--sort-by=.lastTimestamp"}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: nightly-etl, namespace: batch, output: yaml}}
    - {tool: kubectl, args: {verb: get, resource: nodes}}
    - {tool: kubectl, args: {verb: describe, resource: nodes}}
    - {tool: kubectl, args: {verb: describe, resource: node, name: "{{node}}"}}
    - {tool: kubectl, args: {verb: top, resource: nodes}}
    - {tool: shell, args: {command: "kubectl get pods -n batch"}}
    - {tool: shell, args: {command: "kubectl describe pod {{pod app=nightly-etl ns=batch}} -n batch"}}
    - {tool: shell, args: {command: "kubectl get events -n batch --sort-by=.lastTimestamp"}}
    - {tool: shell, args: {command: "kubectl get nodes"}}
    - {tool: shell, args: {command: "kubectl describe node {{node}}"}}
    - {tool: kubectl, args: {verb: describe, resource: node, name: taracode-evals-worker}}
