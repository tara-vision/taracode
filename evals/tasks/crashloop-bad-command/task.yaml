id: crashloop-bad-command
area: kubernetes
mode: investigate
provenance: recorded
prompt: >
  The invoice-worker deployment in namespace billing never comes up. What is wrong with it?
expect:
  tools_called_any:
    - {tool: kubectl, verb: describe}
    - {tool: kubectl, verb: get, signature_matches: "event"}
    - {tool: shell, signature_matches: "^kubectl (describe|get event)"}
  tools_never:
    - {classification: mutate}
  answer_matches: ["(?i)(no such file|not found|executable|cannot run|start-worker)", "(?i)(command|entrypoint|binary|image)"]
  max_iterations: 8
record:
  scenario: kubernetes/crashloop-bad-command
  calls:
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: billing}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: billing, output: wide}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: billing, output: yaml}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: billing, args: "-l app=invoice-worker"}}
    - {tool: kubectl, args: {verb: describe, resource: pod, name: "{{pod app=invoice-worker ns=billing}}", namespace: billing}}
    - {tool: kubectl, args: {verb: describe, resource: deployment, name: invoice-worker, namespace: billing}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=invoice-worker ns=billing}}", namespace: billing}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=invoice-worker ns=billing}}", namespace: billing, args: "--previous"}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=invoice-worker ns=billing}}", namespace: billing, args: "--previous --tail=50"}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: billing}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: billing, args: "--sort-by=.lastTimestamp"}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: invoice-worker, namespace: billing}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: invoice-worker, namespace: billing, output: yaml}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: invoice-worker, namespace: billing, output: wide}}
    - {tool: kubectl, args: {verb: top, resource: pods, namespace: billing}}
    - {tool: shell, args: {command: "kubectl get pods -n billing"}}
    - {tool: shell, args: {command: "kubectl describe pod {{pod app=invoice-worker ns=billing}} -n billing"}}
    - {tool: shell, args: {command: "kubectl logs {{pod app=invoice-worker ns=billing}} -n billing --previous"}}
    - {tool: shell, args: {command: "kubectl get events -n billing --sort-by=.lastTimestamp"}}
