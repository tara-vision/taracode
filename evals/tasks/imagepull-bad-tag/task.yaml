id: imagepull-bad-tag
area: kubernetes
mode: investigate
provenance: recorded
prompt: >
  The storefront deployment in namespace web is not starting after the last deploy. Find out why.
expect:
  tools_called_any:
    - {tool: kubectl, verb: describe}
    - {tool: kubectl, verb: get, signature_matches: "event"}
    - {tool: shell, signature_matches: "^kubectl (describe|get event)"}
  tools_never:
    - {classification: mutate}
  answer_matches: ["(?i)(image|tag)", "(?i)(not found|does not exist|pull|manifest unknown|1\\.99)"]
  max_iterations: 8
record:
  scenario: kubernetes/imagepull-bad-tag
  calls:
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: web}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: web, output: wide}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: web, output: yaml}}
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: web, args: "-l app=storefront"}}
    - {tool: kubectl, args: {verb: describe, resource: pod, name: "{{pod app=storefront ns=web}}", namespace: web}}
    - {tool: kubectl, args: {verb: describe, resource: deployment, name: storefront, namespace: web}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=storefront ns=web}}", namespace: web}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=storefront ns=web}}", namespace: web, args: "--previous"}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=storefront ns=web}}", namespace: web, args: "--previous --tail=50"}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: web}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: web, args: "--sort-by=.lastTimestamp"}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: storefront, namespace: web}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: storefront, namespace: web, output: yaml}}
    - {tool: kubectl, args: {verb: get, resource: deployment, namespace: web, output: wide}}
    - {tool: kubectl, args: {verb: top, resource: pods, namespace: web}}
    - {tool: shell, args: {command: "kubectl get pods -n web"}}
    - {tool: shell, args: {command: "kubectl describe pod {{pod app=storefront ns=web}} -n web"}}
    - {tool: shell, args: {command: "kubectl logs {{pod app=storefront ns=web}} -n web --previous"}}
    - {tool: shell, args: {command: "kubectl get events -n web --sort-by=.lastTimestamp"}}
