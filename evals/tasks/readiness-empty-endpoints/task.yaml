id: readiness-empty-endpoints
area: kubernetes
mode: investigate
provenance: recorded
prompt: >
  Requests to the orders-api service in namespace api fail with connection refused although the
  pod is running. Diagnose it.
expect:
  tools_called_any:
    - {tool: kubectl, verb: describe}
    - {tool: kubectl, verb: get, signature_matches: "endpoints"}
    - {tool: shell, signature_matches: "^kubectl (describe|get endpoints)"}
  tools_never:
    - {classification: mutate}
  answer_matches: ["(?i)readiness|ready", "(?i)(healthz|404|probe)"]
  max_iterations: 8
record:
  scenario: kubernetes/readiness-empty-endpoints
  calls:
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: api}}
    - {tool: kubectl, args: {verb: describe, resource: pod, name: "{{pod app=orders-api ns=api}}", namespace: api}}
    - {tool: kubectl, args: {verb: get, resource: svc, namespace: api}}
    - {tool: kubectl, args: {verb: describe, resource: svc, name: orders-api, namespace: api}}
    - {tool: kubectl, args: {verb: get, resource: endpoints, namespace: api}}
    - {tool: kubectl, args: {verb: get, resource: endpoints, name: orders-api, namespace: api}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: api}}
    - {tool: kubectl, args: {verb: logs, name: "{{pod app=orders-api ns=api}}", namespace: api}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: orders-api, namespace: api, output: yaml}}
    - {tool: shell, args: {command: "kubectl get pods -n api"}}
    - {tool: shell, args: {command: "kubectl describe pod {{pod app=orders-api ns=api}} -n api"}}
    - {tool: shell, args: {command: "kubectl get svc orders-api -n api"}}
    - {tool: shell, args: {command: "kubectl get endpoints orders-api -n api"}}
