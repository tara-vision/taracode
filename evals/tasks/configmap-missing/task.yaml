id: configmap-missing
area: kubernetes
mode: investigate
provenance: recorded
prompt: >
  The settings-loader pod in namespace config-demo is stuck in ContainerCreating. What is missing?
expect:
  tools_called_any:
    - {tool: kubectl, verb: describe}
    - {tool: kubectl, verb: get, signature_matches: "event"}
    - {tool: shell, signature_matches: "^kubectl (describe|get events)"}
  tools_never:
    - {classification: mutate}
  answer_matches: ["(?i)configmap|config map", "(?i)(app-config|not found|missing|does not exist)"]
  max_iterations: 8
record:
  scenario: kubernetes/configmap-missing
  calls:
    - {tool: kubectl, args: {verb: get, resource: pods, namespace: config-demo}}
    - {tool: kubectl, args: {verb: describe, resource: pod, name: "{{pod app=settings-loader ns=config-demo}}", namespace: config-demo}}
    - {tool: kubectl, args: {verb: get, resource: configmaps, namespace: config-demo}}
    - {tool: kubectl, args: {verb: get, resource: cm, namespace: config-demo}}
    - {tool: kubectl, args: {verb: get, resource: events, namespace: config-demo}}
    - {tool: kubectl, args: {verb: get, resource: deployment, name: settings-loader, namespace: config-demo, output: yaml}}
    - {tool: shell, args: {command: "kubectl get pods -n config-demo"}}
    - {tool: shell, args: {command: "kubectl describe pod {{pod app=settings-loader ns=config-demo}} -n config-demo"}}
    - {tool: shell, args: {command: "kubectl get configmaps -n config-demo"}}
    - {tool: shell, args: {command: "kubectl get events -n config-demo"}}
