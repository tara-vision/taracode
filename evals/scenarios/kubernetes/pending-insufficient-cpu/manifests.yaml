apiVersion: v1
kind: Namespace
metadata:
  name: analytics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: analytics
  labels:
    app: report-builder
spec:
  selector:
    matchLabels:
      app: report-builder
  template:
    metadata:
      labels:
        app: report-builder
    spec:
      containers:
        - name: report-builder
          image: busybox:1.37
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "64"
