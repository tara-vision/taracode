# The calls that fill the common fixture store (docs/evals/README.md, "Common fixtures"): the probes a model types to
# learn which tools the sandbox has and which versions, recorded once per corpus version with `make record-common`.
# Shell lines only; a tool the sandbox lacks records its real "not found" answer, which is the truthful one.
calls:
  - {tool: shell, args: {command: "which terraform"}}
  - {tool: shell, args: {command: "command -v terraform"}}
  - {tool: shell, args: {command: "type terraform"}}
  - {tool: shell, args: {command: "terraform version"}}
  - {tool: shell, args: {command: "terraform --version"}}
  - {tool: shell, args: {command: "terraform -version"}}
  - {tool: shell, args: {command: "which kubectl"}}
  - {tool: shell, args: {command: "command -v kubectl"}}
  - {tool: shell, args: {command: "type kubectl"}}
  - {tool: shell, args: {command: "kubectl version"}}
  - {tool: shell, args: {command: "kubectl --version"}}
  - {tool: shell, args: {command: "kubectl -version"}}
  - {tool: shell, args: {command: "which helm"}}
  - {tool: shell, args: {command: "command -v helm"}}
  - {tool: shell, args: {command: "type helm"}}
  - {tool: shell, args: {command: "helm version"}}
  - {tool: shell, args: {command: "helm --version"}}
  - {tool: shell, args: {command: "helm -version"}}
  - {tool: shell, args: {command: "which docker"}}
  - {tool: shell, args: {command: "command -v docker"}}
  - {tool: shell, args: {command: "type docker"}}
  - {tool: shell, args: {command: "docker version"}}
  - {tool: shell, args: {command: "docker --version"}}
  - {tool: shell, args: {command: "docker -version"}}
  - {tool: shell, args: {command: "which aws"}}
  - {tool: shell, args: {command: "command -v aws"}}
  - {tool: shell, args: {command: "type aws"}}
  - {tool: shell, args: {command: "aws version"}}
  - {tool: shell, args: {command: "aws --version"}}
  - {tool: shell, args: {command: "aws -version"}}
  - {tool: shell, args: {command: "which gcloud"}}
  - {tool: shell, args: {command: "command -v gcloud"}}
  - {tool: shell, args: {command: "type gcloud"}}
  - {tool: shell, args: {command: "gcloud version"}}
  - {tool: shell, args: {command: "gcloud --version"}}
  - {tool: shell, args: {command: "gcloud -version"}}
  - {tool: shell, args: {command: "which az"}}
  - {tool: shell, args: {command: "command -v az"}}
  - {tool: shell, args: {command: "type az"}}
  - {tool: shell, args: {command: "az version"}}
  - {tool: shell, args: {command: "az --version"}}
  - {tool: shell, args: {command: "az -version"}}
  - {tool: shell, args: {command: "which git"}}
  - {tool: shell, args: {command: "command -v git"}}
  - {tool: shell, args: {command: "type git"}}
  - {tool: shell, args: {command: "git version"}}
  - {tool: shell, args: {command: "git --version"}}
  - {tool: shell, args: {command: "git -version"}}
  - {tool: shell, args: {command: "which python3"}}
  - {tool: shell, args: {command: "command -v python3"}}
  - {tool: shell, args: {command: "python3 --version"}}
  - {tool: shell, args: {command: "which jq"}}
  - {tool: shell, args: {command: "command -v jq"}}
  - {tool: shell, args: {command: "jq --version"}}
  - {tool: shell, args: {command: "which curl"}}
  - {tool: shell, args: {command: "command -v curl"}}
  - {tool: shell, args: {command: "curl --version"}}
  - {tool: shell, args: {command: "kubectl version --client"}}
  - {tool: shell, args: {command: "kubectl version --client=true"}}
  - {tool: shell, args: {command: "kubectl version --short"}}
  - {tool: shell, args: {command: "helm version --short"}}
  - {tool: shell, args: {command: "terraform version -json"}}
  - {tool: shell, args: {command: "aws --version 2>&1"}}
  - {tool: shell, args: {command: "which terraform && terraform version"}}
  - {tool: shell, args: {command: "which kubectl && kubectl version --client"}}
  - {tool: shell, args: {command: "which helm && helm version"}}
  - {tool: shell, args: {command: "which docker && docker --version"}}
  - {tool: shell, args: {command: "which aws && aws --version"}}
